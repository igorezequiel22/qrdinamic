<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirigiendo...</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #cfe9ff 0%, #8ec5f5 100%);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      color: #ffffff;
      text-align: center;
    }

    .lds-ring { position: relative; width: 80px; height: 80px; }
    .lds-ring div {
      display: block; position: absolute;
      width: 64px; height: 64px; margin: 8px;
      border: 8px solid #fff; border-radius: 50%;
      animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #fff transparent transparent transparent;
    }
    .lds-ring div:nth-child(1) { animation-delay: -0.45s; }
    .lds-ring div:nth-child(2) { animation-delay: -0.3s; }
    .lds-ring div:nth-child(3) { animation-delay: -0.15s; }
    @keyframes lds-ring {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .text {
      margin-top: 28px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0, 60, 120, 0.25);
    }
    .dots span { animation: blink 1.4s infinite both; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1; }
    }

    .cup {
      margin-top: 14px;
      font-size: 2.6rem;
      animation: float 2.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 6px rgba(0, 60, 120, 0.25));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    #msg {
      margin: 18px 20px 0;
      font-size: 1rem;
      color: #0b3a66;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="lds-ring"><div></div><div></div><div></div><div></div></div>

  <div class="text">Redirigiendo<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="cup">☕</div>
  <p id="msg"></p>

  <script>
    const AS_URL_BASE = "https://script.google.com/macros/s/AKfycbyNdCwqxOL6nKvT5BtSNpVbpQ9z-Euh0RQdgBNb6Rp-_OV_DjI-0YJPLOyazpcyV2NLCg/exec";

    const k = new URLSearchParams(window.location.search).get("k");
    const msg = document.getElementById("msg");

    if (!k) {
      msg.textContent = "Falta el parámetro ?k= en la URL";
    } else {
      fetch(AS_URL_BASE + "?k=" + encodeURIComponent(k))
        .then(r => r.text())
        .then(t => {
          t = t.trim();
          if (t.startsWith("http")) window.location.replace(t);
          else msg.textContent = "Enlace no encontrado: " + k;
        })
        .catch(() => { msg.textContent = "No se pudo redirigir. Intenta de nuevo."; });
    }
  </script>
</body>
</html>
